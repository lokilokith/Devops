name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Formatting & Linting (Black, isort, Flake8, Ruff)
        run: |
          black --check app/ tests/
          isort --check-only app/ tests/
          flake8 app/ tests/
          ruff check app/ tests/

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run Bandit (SAST)
        run: bandit -r app/ -ll -ii
      - name: Run Safety (SCA)
        run: safety check -r requirements.txt --full-report -i 70612
      - name: Run pip-audit (SCA)
        run: pip-audit -r requirements.txt

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: security
    env:
      APP_ENV: testing
      FLASK_APP: app
      JWT_SECRET_KEY: test-secret-key-for-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run Pytest with Coverage
        run: pytest --cov=app --cov-report=xml --cov-fail-under=85 tests/
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Test Docker Build
        run: docker-compose -f docker-compose.yml build
