name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Check code formatting
        run: |
          black --check app/ tests/
          isort --check-only app/ tests/

      - name: Lint with flake8
        run: |
          flake8 app/ tests/

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Bandit (SAST)
        run: |
          bandit -r app/ -ll -ii

      - name: Run Safety (SCA)
        run: |
          safety check -r requirements.txt --full-report -i 70612

      - name: Run pip-audit (SCA)
        run: |
          pip-audit -r requirements.txt

  tests:
    name: Tests and Mutation
    runs-on: ubuntu-latest
    needs: security

    env:
      APP_ENV: testing
      FLASK_APP: app
      JWT_SECRET_KEY: test-secret-key-for-ci-only

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-fail-under=85 tests/

      - name: Run Mutation Testing
        run: |
          mutmut run || echo "Mutation testing completed with surviving mutants"
          mutmut results
          python -c "
          import sqlite3
          try:
              conn = sqlite3.connect('.mutmut-cache')
              c = conn.cursor()
              c.execute('SELECT status, count(*) FROM mutant GROUP BY status')
              results = dict(c.fetchall())
              total = sum(results.values())
              killed = results.get('killed', 0)
              score = (killed / total) * 100 if total > 0 else 100
              print(f'Mutation Score: {score:.2f}%')
              if score < 85.0:
                  print('Mutation score is below 85%!')
                  exit(1)
          except Exception as e:
              print('Failed to calculate mutation score:', e)
          "