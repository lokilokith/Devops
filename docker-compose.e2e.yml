services:
  postgres-e2e:
    image: postgres:15-alpine
    container_name: opsforge-postgres-e2e
    environment:
      POSTGRES_USER: e2e_user
      POSTGRES_PASSWORD: e2e_password
      POSTGRES_DB: opsforge_e2e_db
    ports:
      - "5441:5432"
    networks:
      - opsforge_e2e_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e_user -d opsforge_e2e_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend-e2e:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: opsforge-backend-e2e
    environment:
      - APP_ENV=development
      - SECRET_KEY=e2e_secret_key
      - JWT_SECRET_KEY=e2e_jwt_secret_key
      - DATABASE_URL=postgresql://e2e_user:e2e_password@postgres-e2e:5432/opsforge_e2e_db
      - CORS_ALLOWED_ORIGINS=*
      - VAULT_MASTER_KEY=MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      - LOGIN_RATE_LIMIT=1000 per minute
    ports:
      - "8081:5000"
    depends_on:
      postgres-e2e:
        condition: service_healthy
    networks:
      opsforge_e2e_net:
        aliases:
          - backend
    restart: unless-stopped

  frontend-e2e:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: opsforge-frontend-e2e
    ports:
      - "8082:80"
    volumes:
      - ./tests/e2e/nginx.e2e.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend-e2e:
        condition: service_started
    networks:
      - opsforge_e2e_net
    restart: unless-stopped

networks:
  opsforge_e2e_net:
    name: opsforge_e2e_net
    driver: bridge
