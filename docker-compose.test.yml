services:
  test-db:
    image: postgres:15-alpine
    container_name: opsforge-test-db
    environment:
      POSTGRES_USER: opsforge_test
      POSTGRES_PASSWORD: opsforge_test
      POSTGRES_DB: opsforge_test
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsforge_test -d opsforge_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
