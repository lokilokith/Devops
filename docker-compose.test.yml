services:
  test-db:
    image: postgres:15-alpine
    container_name: opsforge-test-db
    environment:
      POSTGRES_USER: opsforge
      POSTGRES_PASSWORD: opsforge_pass
      POSTGRES_DB: opsforge_test_db
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsforge -d opsforge_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
