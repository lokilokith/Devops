services:
  postgres:
    image: postgres:15-alpine
    container_name: opsforge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsforge_pass}
      POSTGRES_DB: ${POSTGRES_DB:-opsforge_db}
    volumes:
      - opsforge_postgres_data:/var/lib/postgresql/data
    networks:
      - opsforge_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsforge} -d ${POSTGRES_DB:-opsforge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: opsforge-backend
    environment:
      - APP_ENV=${APP_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-opsforge}:${POSTGRES_PASSWORD:-opsforge_pass}@postgres:5432/${POSTGRES_DB:-opsforge_db}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - opsforge_net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: opsforge-frontend
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - opsforge_net
    restart: unless-stopped

networks:
  opsforge_net:
    name: opsforge_net
    driver: bridge

volumes:
  opsforge_postgres_data:
    name: opsforge_postgres_data
