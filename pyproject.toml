[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opsforge"
version = "0.1.0"
description = "A portfolio-quality DevSecOps Threat Intelligence Management Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "OpsForge Team"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "Flask>=3.0.0,<4.0.0",
    "Flask-SQLAlchemy>=3.1.0,<4.0.0",
    "Flask-Migrate>=4.0.0,<5.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "flask-restx>=1.3.0",
    "Flask-CORS>=6.0.0,<7.0.0",
    "gunicorn>=22.0.0,<23.0.0",
    "PyJWT>=2.0.0,<3.0.0",
    "blinker>=1.6.2,<2.0.0",
    "Flask-Limiter>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.3.0",
    "flake8",
    "mypy",
    "pytest-cov>=4.1.0",
    "bandit",
    "safety",
    "pip-audit",
    "mutmut",
    "factory_boy",
    "pytest-mock"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mutmut]
source_paths = ["app"]
pytest_add_cli_args_test_selection = ["tests"]